<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabbi Games</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png">

<style>
/* ===========================
   GLOBAL STYLES
   =========================== */
html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    font-family: 'Oswald', sans-serif;
    background-color: white;
    color: black;
}

/* ===========================
   TOP NAVBAR
   =========================== */
.navbar {
    background-color: black;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 20px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
}

.navbar a {
    color: white;
    text-decoration: none;
    font-size: 1.2em;
}

.nav-icons img {
    width: 30px;
    height: 30px;
    margin-left: 15px;
    transition: transform 0.3s;
}

.nav-icons img.youtube {
    height: 24px;
}

.nav-icons img.tiktok {
    width: 24px;
    height: 24px;
}

.instagram {
    position: relative;
    top: 3px;
}

.nav-icons img:hover {
    transform: scale(1.2);
}

/* ===========================
   HERO BANNER (FIRST IMAGE)
   =========================== */
.hero-banner {
    width: 100%;
    margin-top: 70px; 
}

.hero-banner img {
    width: 100%;
    height: auto;
    display: block;
}

/* ===========================
   MIDDLE TEXT SECTION
   =========================== */
.intro-banner {
    text-align: center;
    font-size: 2.8em;
    font-weight: 700;
    text-transform: uppercase;
    color: black;
    background-color: white;
    padding: 20px 20px;
    max-width: 1000px;
    margin: 0 auto;
    line-height: 1.2;
    letter-spacing: 1px;
}

/* ===========================
   SECOND GRAPHIC IMAGE & OVERLAY
   =========================== */
.graphic-wrapper {
    width: 100%;
    overflow: hidden;
    position: relative;
}

.graphic-wrapper img {
    width: 100%;
    height: auto;
    display: block;
}

/* Founder Card Overlay over Stone Texture */
.founder-card {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 35px;
    color: white;
    text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.95);
    z-index: 10;
    width: 85%;
    max-width: 950px;
}

/* Image cropped to portrait ratio to strip empty horizontal margins */
.founder-img {
    width: 170px; /* Narrower width */
    height: 280px; /* Taller height */
    object-fit: cover; /* Crops out left & right unused space from 1k x 1k image */
    object-position: center;
    border: 3px solid white;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    flex-shrink: 0;
}

.founder-info {
    text-align: left;
    text-transform: uppercase;
}

/* Increased Font Sizes */
.founder-info h2 {
    font-size: 3.2em;
    margin: 0 0 6px 0;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 1px;
}

.founder-info p {
    font-size: 1.6em;
    margin: 6px 0;
    font-weight: 400;
    color: #f5f5f5;
    line-height: 1.2;
}

/* ===========================
   MOBILE STYLES (Screen <= 768px)
   =========================== */
@media (max-width: 768px) {
    .intro-banner {
        font-size: 1.7em;
        padding: 12px 15px;
    }

    .graphic-wrapper img {
        width: 200%;
        max-width: none;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
    }

    .founder-card {
        bottom: 7%;
        gap: 18px;
        width: 92%;
    }

    .founder-img {
        width: 105px;
        height: 170px;
        border-width: 2px;
    }

    .founder-info h2 {
        font-size: 1.8em;
    }

    .founder-info p {
        font-size: 0.95em;
        margin: 3px 0;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <a href="https://sabbigames.com">Sabbi Games</a>
    <div class="nav-icons">
        <a href="https://www.youtube.com/@Sabbi.Games.Development"><img src="/assets/youtube-icon.jpg" alt="YouTube" class="youtube"></a>
        <a href="https://www.instagram.com/sabbigames"><img src="/assets/instagram-icon.png" alt="Instagram" class="instagram"></a>
        <a href="https://www.tiktok.com/@sabbi.games.development"><img src="/assets/tt-icon.png" alt="TikTok" class="tiktok"></a>
    </div>
</div>

<!-- FIRST IMAGE -->
<div class="hero-banner">
    <img src="/assets/SabbiGamesLogo4.png" alt="Sabbi Games Banner">
</div>

<!-- MIDDLE TEXT -->
<div class="intro-banner">
    Sabbi Games is here to create free fast paced games with no ads
</div>

<!-- SECOND IMAGE WITH FOUNDER OVERLAY -->
<div class="graphic-wrapper">
    <img src="/assets/0websiteGraphics.png" alt="Sabbi Games Showcase">

    <!-- Founder Card over Stone Background -->
    <div class="founder-card">
        <img src="/assets/denysInMail.png" alt="Denys Udod" class="founder-img">
        <div class="founder-info">
            <h2>Denys Udod</h2>
            <p>CEO of Sabbi Games</p>
            <p>17 years old high schooler</p>
            <p>From Vancouver, BC, Canada</p>
            <p>Programmer, artist and filmmaker</p>
        </div>
    </div>
</div>

</body>
</html>
