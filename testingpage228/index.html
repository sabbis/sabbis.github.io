<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabbi Games</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png">

<style>
/* ===========================
   GLOBAL STYLES
   =========================== */
html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    font-family: 'Oswald', sans-serif;
    background-color: white;
    color: black;
}

/* ===========================
   TOP NAVBAR
   =========================== */
.navbar {
    background-color: black;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 20px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
}

.navbar a {
    color: white;
    text-decoration: none;
    font-size: 1.2em;
}

.nav-icons img {
    width: 30px;
    height: 30px;
    margin-left: 15px;
    transition: transform 0.3s;
}

.nav-icons img.youtube {
    height: 24px;
}

.nav-icons img.tiktok {
    width: 24px;
    height: 24px;
}

.instagram {
    position: relative;
    top: 3px;
}

.nav-icons img:hover {
    transform: scale(1.2);
}

/* ===========================
   HERO BANNER
   =========================== */
.hero-banner {
    width: 100%;
    margin-top: 70px; 
}

.hero-banner img {
    width: 100%;
    height: auto;
    display: block;
}

/* ===========================
   SHOWCASE GRAPHIC SECTION
   =========================== */
.showcase-container {
    position: relative;
    width: 100%;
    background-color: white;
    overflow: hidden;
}

.graphic-wrapper {
    width: 100%;
}

.graphic-wrapper img {
    width: 100%;
    height: auto;
    display: block;
}

.showcase-text {
    color: black;
    font-size: 2.1em;
    line-height: 1.3;
    text-transform: uppercase;
    font-weight: 700;
    z-index: 10;
}

/* ===========================
   DESKTOP STYLES (Screen > 768px)
   =========================== */
@media (min-width: 769px) {
    .showcase-text {
        position: absolute;
        /* Using viewport-width units (vw) keeps vertical alignment proportional to image scaling on all monitors */
        top: 14vw; 
        width: 28%;
        text-align: center;
    }

    .text-left {
        /* Calculates exact 1.5 / 6 screen position (25%) */
        left: calc(100% * (1.5 / 6));
        transform: translateX(-50%);
    }

    .text-right {
        /* Calculates opposite side 4.5 / 6 screen position (75%) */
        left: calc(100% * (4.5 / 6));
        transform: translateX(-50%);
    }
}

/* ===========================
   MOBILE STYLES (Screen <= 768px)
   =========================== */
@media (max-width: 768px) {
    .showcase-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 25px;
    }

    .showcase-text {
        position: static;
        width: 90%;
        text-align: center;
        font-size: 1.65em;
        line-height: 1.3;
    }

    .text-left {
        order: 1;
        margin-bottom: 20px;
    }

    .text-right {
        order: 2;
        margin-bottom: 30px;
    }

    .graphic-wrapper {
        order: 3;
        width: 195%;
        max-width: none;
        display: flex;
        justify-content: center;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <a href="https://sabbigames.com">Sabbi Games</a>
    <div class="nav-icons">
        <a href="https://www.youtube.com/@Sabbi.Games.Development"><img src="/assets/youtube-icon.jpg" alt="YouTube" class="youtube"></a>
        <a href="https://www.instagram.com/sabbigames"><img src="/assets/instagram-icon.png" alt="Instagram" class="instagram"></a>
        <a href="https://www.tiktok.com/@sabbi.games.development"><img src="/assets/tt-icon.png" alt="TikTok" class="tiktok"></a>
    </div>
</div>

<!-- TOP HERO BANNER -->
<div class="hero-banner">
    <img src="/assets/SabbiGamesLogo4.png" alt="Sabbi Games Banner">
</div>

<!-- SHOWCASE GRAPHIC SECTION -->
<div class="showcase-container">

    <!-- Left Text Block -->
    <div class="showcase-text text-left">
        Crafting Unique Worlds<br>
        Fast Paced Gameplay<br>
        Built For Mobile<br>
        Endless Grid Puzzles<br>
        Simple Intuitive Controls<br>
        Clean Modern Visuals<br>
        Pure Indie Passion
    </div>

    <!-- Right Text Block -->
    <div class="showcase-text text-right">
        Slide Bounce Win<br>
        Master Every Level<br>
        Challenging Wall Physics<br>
        Available Free Now<br>
        Download On iOS<br>
        Get On Android<br>
        Join The Journey
    </div>

    <!-- Main Graphic Image -->
    <div class="graphic-wrapper">
        <img src="/assets/0websiteGraphics.png" alt="Sabbi Games Showcase">
    </div>

</div>

</body>
</html>
