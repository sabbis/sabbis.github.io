<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabbi Games</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
/* ===========================
   GLOBAL STYLES
   =========================== */
html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    font-family: 'Oswald', sans-serif;
    background-color: white;
    color: black;
}
/* ===========================
   TOP NAVBAR
   =========================== */
.navbar {
    background-color: black;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 20px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
}
.navbar a {
    color: white;
    text-decoration: none;
    font-size: 1.2em;
}
.nav-icons img {
    width: 30px;
    height: 30px;
    margin-left: 15px;
    transition: transform 0.3s;
}
.nav-icons img.youtube {
    height: 24px;
}
.nav-icons img.tiktok {
    width: 24px;
    height: 24px;
}
.instagram {
    position: relative;
    top: 3px;
}
.nav-icons img:hover {
    transform: scale(1.2);
}
/* ===========================
   HERO BANNER (FIRST IMAGE)
   =========================== */
.hero-banner {
    width: 100%;
    margin-top: 70px; 
}
.hero-banner img {
    width: 100%;
    height: auto;
    display: block;
}
/* ===========================
   MIDDLE TEXT SECTION
   =========================== */
.intro-banner {
    text-align: center;
    font-size: 2.8em;
    font-weight: 700;
    text-transform: uppercase;
    color: black;
    padding: 20px 20px;
    max-width: 1000px;
    margin: 0 auto;
    line-height: 1.2;
    letter-spacing: 1px;
}
/* ===========================
   WHO IS BEHIND ALL THIS (PHOTO1 + CREATOR OVERLAY)
   DESKTOP: photo + text overlaid side-by-side on the stone,
   Canadian ribbon centered below both
   =========================== */
.who-behind {
    width: 100%;
    position: relative;
}
.who-behind-bg {
    width: 100%;
    height: auto;
    display: block;
}
/* Non-mobile: no special positioning needed on this wrapper —
   .creator-photo / .creator-text position themselves directly
   against .who-behind. On mobile this wrapper itself becomes
   the positioned element (see media query below). */
.creator-block {
    position: static;
}
.creator-photo {
    position: absolute;
    top: 45.9%;
    left: 6.3%;
    width: 38.66%;
    height: auto;
}
.creator-text {
    position: absolute;
    top: 45.9%;
    left: 50.11%;
    width: 44.73%;
    height: 35.43%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.75);
}
.creator-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: clamp(20px, 4.2vw, 74px);
    margin: 0 0 0.6em 0;
}
.creator-details {
    font-family: 'Oswald', sans-serif;
    font-weight: 400;
    font-size: clamp(13px, 2.6vw, 46px);
    line-height: 1.4;
}
.canadian-banner {
    position: absolute;
    top: 84%;
    left: 50%;
    width: 55%;
    height: auto;
    transform: translateX(-50%);
}
/* ===========================
   FLYING CLOUDS
   Sit fixed at the screen edges. Swiping/scrolling down sends
   them flying off-screen; scrolling back up brings them home.
   =========================== */
.cloud {
    position: fixed;
    top: 100px;
    width: 220px;
    height: auto;
    z-index: 500;
    pointer-events: none;
    transition: transform 0.6s ease;
}
.cloud-left {
    left: -40px;
}
.cloud-right {
    right: -40px;
}
body.clouds-hidden .cloud-left {
    transform: translateX(-250%);
}
body.clouds-hidden .cloud-right {
    transform: translateX(250%);
}
/* ===========================
   MOBILE STYLES (Screen <= 768px)
   who-behind-bg zooms/crops as before. The photo, text, and
   banner now live inside .creator-block, which becomes the
   positioned, absolutely-placed element (anchored on the
   stone); they stack inside it in normal flow.
   =========================== */
@media (max-width: 768px) {
    .intro-banner {
        font-size: 1.7em;
        padding: 12px 15px;
    }

    .who-behind {
        overflow: hidden;
    }
    .who-behind-bg {
        width: 200%;
        max-width: none;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
    }

    .creator-block {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
    }
    .creator-photo {
        position: static;
        display: block;
        width: 55%;
        height: auto;
        margin: 0 auto;
    }
    .creator-text {
        position: static;
        width: 85%;
        height: auto;
        margin: 6px auto 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        color: white;
        text-shadow: 2px 2px 8px rgba(0,0,0,0.75);
    }
    .creator-name {
        font-size: clamp(22px, 7vw, 32px);
        margin: 0 0 0.2em 0;
    }
    .creator-details {
        font-size: clamp(16px, 5vw, 22px);
    }
    .canadian-banner {
        position: static;
        display: block;
        width: 70%;
        height: auto;
        margin: 6px auto 0;
        left: auto;
        transform: none;
    }
    .cloud {
        width: 130px;
    }
}
</style>
</head>
<body>
<!-- FLYING CLOUDS -->
<img src="/assets/cloud-left.png" class="cloud cloud-left" alt="">
<img src="/assets/cloud-right.png" class="cloud cloud-right" alt="">

<!-- NAVBAR -->
<div class="navbar">
    <a href="https://sabbigames.com">Sabbi Games</a>
    <div class="nav-icons">
        <a href="https://www.youtube.com/@Sabbi.Games.Development"><img src="/assets/youtube-icon.jpg" alt="YouTube" class="youtube"></a>
        <a href="https://www.instagram.com/sabbigames"><img src="/assets/instagram-icon.png" alt="Instagram" class="instagram"></a>
        <a href="https://www.tiktok.com/@sabbi.games.development"><img src="/assets/tt-icon.png" alt="TikTok" class="tiktok"></a>
    </div>
</div>
<!-- FIRST IMAGE -->
<div class="hero-banner">
    <img src="/assets/SabbiGamesLogo4.png" alt="Sabbi Games Banner">
</div>
<!-- MIDDLE TEXT -->
<div class="intro-banner">
    Sabbi Games is here to create free fast paced games with no ads
</div>

<!-- WHO IS BEHIND ALL THIS -->
<div class="who-behind">
    <img class="who-behind-bg" src="/assets/photo3.png" alt="Who is behind all this?">
    <div class="creator-block">
        <img class="creator-photo" src="/assets/denysInMail2.png" alt="Denys Udod">
        <div class="creator-text">
            <div class="creator-name">Denys Udod</div>
            <div class="creator-details">
                17 years old high schooler<br>
                From Vancouver, BC, Canada<br>
                CEO of Sabbi Games<br>
                Programmer, artist and filmmaker
            </div>
        </div>
        <img class="canadian-banner" src="/assets/proudlyCanadian2.png" alt="Proudly Canadian">
    </div>
</div>

<script>
let lastScrollY = window.scrollY;
window.addEventListener('scroll', () => {
    const currentScrollY = window.scrollY;
    if (currentScrollY > lastScrollY) {
        document.body.classList.add('clouds-hidden');   // scrolling down
    } else if (currentScrollY < lastScrollY) {
        document.body.classList.remove('clouds-hidden'); // scrolling up
    }
    lastScrollY = currentScrollY;
}, { passive: true });
</script>
</body>
</html>
