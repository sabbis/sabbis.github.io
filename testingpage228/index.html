<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Sabbi Games - Free mobile games with no ads">
<meta property="og:description" content="Sabbi Games is here to create awesome, free, fast-paced games with no ads or in-game-purchases. Crazy Way, Tank Rush - were all created by Sabbi.">
<title>Sabbi Games</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
/* ===========================
   GLOBAL STYLES
   =========================== */
html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    font-family: 'Oswald', sans-serif;
    background-color: white;
    color: black;
}
/* ===========================
   TOP NAVBAR
   =========================== */
.navbar {
    background-color: black;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 20px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
}
.navbar a {
    color: white;
    text-decoration: none;
    font-size: 1.2em;
}
.nav-icons img {
    width: 30px;
    height: 30px;
    margin-left: 15px;
    transition: transform 0.3s;
}
.nav-icons img.youtube {
    height: 24px;
}
.nav-icons img.tiktok {
    width: 24px;
    height: 24px;
}
.instagram {
    position: relative;
    top: 3px;
}
.nav-icons img:hover {
    transform: scale(1.2);
}
/* ===========================
   HERO BANNER (FIRST IMAGE)
   =========================== */
.hero-banner {
    width: 100%;
    margin-top: 70px; 
}
.hero-banner img {
    width: 100%;
    height: auto;
    display: block;
}
/* ===========================
   MIDDLE TEXT SECTION
   =========================== */
.intro-banner {
    text-align: center;
    font-size: 2.8em;
    font-weight: 700;
    text-transform: uppercase;
    color: black;
    padding: 20px 20px;
    max-width: 1000px;
    margin: 0 auto;
    line-height: 1.2;
    letter-spacing: 1px;
}
/* ===========================
   WHO IS BEHIND ALL THIS (PHOTO4 + CREATOR OVERLAY)
   DESKTOP: photo + text overlaid side-by-side on the stone,
   Canadian ribbon centered below both.
   z-index: 2 so photo4's jagged bottom edge sits ON TOP of the
   mine section below it, hiding the seam from photo4's side.
   =========================== */
.who-behind {
    width: 100%;
    position: relative;
    z-index: 2;
}
.who-behind-bg {
    width: 100%;
    height: auto;
    display: block;
}
/* Non-mobile: no special positioning needed on this wrapper —
   .creator-photo / .creator-text position themselves directly
   against .who-behind. On mobile this wrapper itself becomes
   the positioned element (see media query below). */
.creator-block {
    position: static;
}
.creator-photo {
    position: absolute;
    top: 48%;
    left: 6.3%;
    width: 38.66%;
    height: auto;
}
.creator-text {
    position: absolute;
    top: 45.9%;
    left: 50.11%;
    width: 44.73%;
    height: 35.43%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.75);
}
.creator-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: clamp(20px, 4.2vw, 74px);
    margin: 0 0 0.6em 0;
}
.creator-details {
    font-family: 'Oswald', sans-serif;
    font-weight: 400;
    font-size: clamp(13px, 2.6vw, 46px);
    line-height: 1.4;
}
.canadian-banner {
    position: absolute;
    top: 84%;
    left: 50%;
    width: 55%;
    height: auto;
    transform: translateX(-50%);
}
/* ===========================
   MINE CART SECTION
   Layer order (bottom to top): mine background w/ rails,
   rolling cart, "Delivering you quality..." text, jagged rock
   overlay that hides most of the track except a few gaps.
   z-index: 1 (lower than .who-behind's z-index: 2) so photo4
   overlaps ON TOP of this section, not the other way around.
   =========================== */
.mine-section {
    width: 100%;
    position: relative;
    z-index: 1;
    overflow: hidden;
    /* -3vw scales the overlap with the image itself; the -10px
       is the extra fixed nudge you asked for. Change ONLY the
       "10px" number below to move the mine section further up
       or down under photo4. */
    margin-top: calc(-3vw - 40px);
}
.mine-bg {
    width: 100%;
    height: auto;
    display: block;
}
.mine-cart {
    position: absolute;
    top: 30.8%;
    left: -15%;
    width: 100%;
    height: auto;
    z-index: 10;
}
.mine-text {
    position: absolute;
    top: 28%;
    left: 50%;
    width: 80%;
    transform: translateX(-50%);
    text-align: center;
    color: white;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.75);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: clamp(28px, 4.2vw, 68px);
    z-index: 11;
}
.mine-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: auto;
    z-index: 12;
    pointer-events: none;
}
/* ===========================
   FIELD SECTION (NEXT GRAPHIC)
   =========================== */
.field-section {
    width: 100%;
    position: relative;
}
.field-img {
    width: 100%;
    height: auto;
    display: block;
}
/* ===========================
   MOBILE STYLES (Screen <= 768px)
   who-behind-bg zooms/crops as before. The photo, text, and
   banner now live inside .creator-block, which becomes the
   positioned, absolutely-placed element (anchored on the
   stone); they stack inside it in normal flow.
   =========================== */
@media (max-width: 768px) {
    .intro-banner {
        font-size: 1.7em;
        padding: 12px 15px;
    }

    .who-behind {
        overflow: hidden;
    }
    .who-behind-bg {
        width: 200%;
        max-width: none;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
    }

    .creator-block {
        position: absolute;
        top: 54%;
        left: 0;
        width: 100%;
    }
    .creator-photo {
        position: static;
        display: block;
        width: 55%;
        height: auto;
        margin: 0 auto;
    }
    .creator-text {
        position: static;
        width: 85%;
        height: auto;
        margin: 6px auto 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        color: white;
        text-shadow: 2px 2px 8px rgba(0,0,0,0.75);
    }
    .creator-name {
        font-size: clamp(22px, 7vw, 32px);
        margin: 0 0 0.2em 0;
    }
    .creator-details {
        font-size: clamp(16px, 5vw, 22px);
    }
    .canadian-banner {
        position: static;
        display: block;
        width: 70%;
        height: auto;
        margin: 6px auto 0;
        left: auto;
        transform: none;
    }

    .mine-cart {
        top: 68.7%;
        width: 100%;
    }
    .mine-text {
        top: 26%;
        font-size: clamp(20px, 6.5vw, 34px);
    }
}
</style>
</head>
<body>
<!-- NAVBAR -->
<div class="navbar">
    <a href="https://sabbigames.com">Sabbi Games</a>
    <div class="nav-icons">
        <a href="https://www.youtube.com/@Sabbi.Games.Development"><img src="/assets/youtube-icon.jpg" alt="YouTube" class="youtube"></a>
        <a href="https://www.instagram.com/sabbigames"><img src="/assets/instagram-icon.png" alt="Instagram" class="instagram"></a>
        <a href="https://www.tiktok.com/@sabbi.games.development"><img src="/assets/tt-icon.png" alt="TikTok" class="tiktok"></a>
    </div>
</div>
<!-- FIRST IMAGE -->
<div class="hero-banner">
    <img src="/assets/SabbiGamesLogo4.png" alt="Sabbi Games Banner">
</div>
<!-- MIDDLE TEXT -->
<div class="intro-banner">
    Sabbi Games is here to create free fast paced games with no ads
</div>

<!-- WHO IS BEHIND ALL THIS -->
<div class="who-behind">
    <img class="who-behind-bg" src="/assets/photo4.png" alt="Who is behind all this?">
    <div class="creator-block">
        <img class="creator-photo" src="/assets/denysInMail2.png" alt="Denys Udod">
        <div class="creator-text">
            <div class="creator-name">Denys Udod</div>
            <div class="creator-details">
                17 years old high schooler<br>
                From Vancouver, BC, Canada<br>
                CEO of Sabbi Games<br>
                Programmer, artist and filmmaker
            </div>
        </div>
        <img class="canadian-banner" src="/assets/proudlyCanadian2.png" alt="Proudly Canadian">
    </div>
</div>

<!-- MINE CART -->
<div class="mine-section">
    <img class="mine-bg" src="/assets/cartBottom.png" alt="Mine tunnel">
    <img class="mine-cart" src="/assets/cart.png" alt="Mine cart">
    <div class="mine-text">Delivering you quality...</div>
    <img class="mine-overlay" src="/assets/cartTop.png" alt="">
</div>

<!-- FIELD -->
<div class="field-section">
    <img class="field-img" src="/assets/field.png" alt="Field">
</div>

<script>
const mineSection = document.querySelector('.mine-section');
const cart = document.querySelector('.mine-cart');

function updateCartPosition() {
    if (!mineSection || !cart) return;
    const rect = mineSection.getBoundingClientRect();
    const vh = window.innerHeight;

    // Section not in view yet (below the viewport) or already
    // fully scrolled past (above the viewport) — park the cart
    // off-screen and do nothing else.
    if (rect.top >= vh || rect.bottom <= 0) {
        cart.style.left = '-15%';
        return;
    }

    // 0 = section's top edge just reached the bottom of the screen
    // 0.5 = section is vertically centered in the viewport
    // 1 = section's bottom edge has reached the top of the screen
    let progress = (vh - rect.top) / (vh + rect.height);
    progress = Math.max(0, Math.min(1, progress));

    const leftPercent = -15 + progress * 130; // fully off-left to fully off-right
    cart.style.left = leftPercent + '%';
}

window.addEventListener('scroll', updateCartPosition, { passive: true });
window.addEventListener('resize', updateCartPosition);
window.addEventListener('load', updateCartPosition);
updateCartPosition();
</script>
</body>
</html>
